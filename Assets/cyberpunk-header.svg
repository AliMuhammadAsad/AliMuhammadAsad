<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060A" />
      <stop offset="50%" stop-color="#0A0C16" />
      <stop offset="100%" stop-color="#06070E" />
    </linearGradient>

    <linearGradient id="cyan-purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#9D00FF" />
    </linearGradient>

    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0, 240, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Dot Grid Pattern -->
    <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="rgba(0, 240, 255, 0.12)" />
    </pattern>

    <style>
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 0.8; filter: drop-shadow(0 0 4px #00F0FF); }
        50% { stroke-opacity: 0.3; filter: drop-shadow(0 0 1px #00F0FF); }
      }
      @keyframes radarSweep {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 0.3; }
        100% { transform: translateY(240px); opacity: 0; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes textShimmer {
        0% { stop-color: #00F0FF; }
        50% { stop-color: #A855F7; }
        100% { stop-color: #00F0FF; }
      }
      .cyber-border {
        animation: pulseBorder 4s infinite ease-in-out;
      }
      .hud-title {
        font-family: 'Courier New', Courier, monospace, 'Segoe UI', system-ui;
        font-weight: 900;
        letter-spacing: 5px;
        fill: #FFFFFF;
      }
      .hud-sub {
        font-family: 'Courier New', Courier, monospace, 'Segoe UI', system-ui;
        font-size: 13px;
        letter-spacing: 2.5px;
        font-weight: 700;
        fill: #00F0FF;
      }
      .hud-tag {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 600;
        fill: #94A3B8;
      }
      .hud-pill {
        font-family: 'Courier New', Courier, monospace;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .cursor {
        animation: blinkCursor 1s infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="10" fill="url(#bg-grad)" />

  <!-- Grid Overlay -->
  <rect width="900" height="240" rx="10" fill="url(#cyber-grid)" />
  <rect width="900" height="240" rx="10" fill="url(#scanlines)" />

  <!-- Tactical Outer Border & Corner Brackets -->
  <rect x="2" y="2" width="896" height="236" rx="8" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="8" y="8" width="884" height="224" rx="6" fill="none" stroke="#00F0FF" stroke-width="1.2" class="cyber-border" />

  <!-- Corner Tech Reticles -->
  <!-- Top Left -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <circle cx="16" cy="16" r="1.5" fill="#00F0FF" />
  <!-- Top Right -->
  <path d="M 888 28 L 888 12 L 872 12" fill="none" stroke="#9D00FF" stroke-width="2.5" />
  <circle cx="884" cy="16" r="1.5" fill="#9D00FF" />
  <!-- Bottom Left -->
  <path d="M 12 212 L 12 228 L 28 228" fill="none" stroke="#9D00FF" stroke-width="2.5" />
  <circle cx="16" cy="224" r="1.5" fill="#9D00FF" />
  <!-- Bottom Right -->
  <path d="M 888 212 L 888 228 L 872 228" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <circle cx="884" cy="224" r="1.5" fill="#00F0FF" />

  <!-- Header Top Bar System Telemetry -->
  <rect x="24" y="20" width="852" height="24" rx="3" fill="rgba(15, 23, 42, 0.75)" stroke="#1E293B" stroke-width="1" />
  <circle cx="36" cy="32" r="3" fill="#00FFA3" filter="url(#glow-cyan)" />
  <text x="46" y="36" class="hud-pill" fill="#00FFA3">SYSTEM_STATUS: ONLINE</text>
  <text x="210" y="36" class="hud-pill" fill="#64748B">//</text>
  <text x="230" y="36" class="hud-pill" fill="#94A3B8">CORE: ALI_MUHAMMAD_ASAD.v3.8</text>
  <text x="480" y="36" class="hud-pill" fill="#64748B">//</text>
  <text x="500" y="36" class="hud-pill" fill="#38BDF8">LOC: 24.8607° N, 67.0011° E</text>
  <text x="730" y="36" class="hud-pill" fill="#A855F7">[ SECURITY: CLEAR ]</text>

  <!-- Central Holographic Identity -->
  <g transform="translate(40, 75)">
    <!-- Main Callout Prefix -->
    <text x="0" y="15" class="hud-sub">INITIALIZING AGENTIC ARCHITECT &gt;&gt;&gt;</text>

    <!-- Main Name Title -->
    <text x="0" y="58" class="hud-title" font-size="38" fill="url(#cyan-purple-grad)" filter="url(#glow-cyan)">
      ALI MUHAMMAD ASAD
    </text>
    <rect x="495" y="26" width="10" height="34" fill="#00F0FF" class="cursor" filter="url(#glow-cyan)" />

    <!-- Subtitle Role -->
    <text x="2" y="85" class="hud-tag" font-size="13">
      AI &amp; LLM ENGINEER  |  AGENTIC SYSTEMS ARCHITECT  |  PROCESS AUTOMATION
    </text>
  </g>

  <!-- Decorative Hex Grid & Accents on Right Side -->
  <g transform="translate(670, 72)">
    <!-- Cyber Decal Box -->
    <rect x="0" y="0" width="190" height="88" rx="4" fill="rgba(10, 15, 30, 0.85)" stroke="#334155" stroke-width="1" />
    <path d="M 0 0 L 190 0 L 190 18 L 175 24 L 0 24 Z" fill="rgba(0, 240, 255, 0.08)" />
    <text x="12" y="16" class="hud-pill" fill="#00F0FF">&gt; TELEMETRY_ACTIVE</text>

    <text x="12" y="40" class="hud-pill" fill="#94A3B8">DATASET: <tspan fill="#00FFA3">33GB URDU</tspan></text>
    <text x="12" y="56" class="hud-pill" fill="#94A3B8">IEEE DOC: <tspan fill="#38BDF8">PASHTO DL</tspan></text>
    <text x="12" y="72" class="hud-pill" fill="#94A3B8">STANFORD: <tspan fill="#A855F7">IHP '24 GRANT</tspan></text>

    <circle cx="170" cy="54" r="10" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2,2" />
    <circle cx="170" cy="54" r="3" fill="#9D00FF" />
  </g>

  <!-- Bottom Badges / Tactical Pill Banner -->
  <g transform="translate(24, 192)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="158" height="26" rx="13" fill="rgba(0, 240, 255, 0.08)" stroke="#00F0FF" stroke-width="1" />
    <text x="16" y="17" class="hud-pill" fill="#00F0FF">⚡ ALIF URDU LLM</text>

    <!-- Pill 2 -->
    <rect x="168" y="0" width="168" height="26" rx="13" fill="rgba(157, 0, 255, 0.08)" stroke="#9D00FF" stroke-width="1" />
    <text x="184" y="17" class="hud-pill" fill="#C084FC">🔬 IEEE RESEARCH</text>

    <!-- Pill 3 -->
    <rect x="346" y="0" width="160" height="26" rx="13" fill="rgba(0, 255, 163, 0.08)" stroke="#00FFA3" stroke-width="1" />
    <text x="362" y="17" class="hud-pill" fill="#00FFA3">🤖 AGENTIC RAG</text>

    <!-- Pill 4 -->
    <rect x="516" y="0" width="170" height="26" rx="13" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="1" />
    <text x="532" y="17" class="hud-pill" fill="#FBBF24">🏛️ STANFORD IHP '24</text>

    <!-- Pill 5 -->
    <rect x="696" y="0" width="156" height="26" rx="13" fill="rgba(56, 189, 248, 0.08)" stroke="#38BDF8" stroke-width="1" />
    <text x="712" y="17" class="hud-pill" fill="#38BDF8">🏆 ICPC TOP 10 REG</text>
  </g>
</svg>

