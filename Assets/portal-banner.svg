<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 64" width="100%" height="64">
  <defs>
    <linearGradient id="portal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <filter id="portal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes neonPulse {
        0%, 100% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00F0FF); }
        50% { stroke-opacity: 0.4; filter: drop-shadow(0 0 2px #7000FF); }
      }
      .portal-box {
        animation: neonPulse 3s infinite ease-in-out;
      }
      .portal-text {
        font-family: 'Courier New', Courier, monospace, 'Segoe UI', sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <rect x="2" y="2" width="846" height="60" rx="8" fill="#0A0C16" stroke="url(#portal-grad)" stroke-width="2" class="portal-box" />

  <!-- Corner Tech Highlights -->
  <path d="M 8 20 L 8 8 L 20 8" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 842 20 L 842 8 L 830 8" fill="none" stroke="#00FFA3" stroke-width="2" />
  <path d="M 8 44 L 8 56 L 20 56" fill="none" stroke="#7000FF" stroke-width="2" />
  <path d="M 842 44 L 842 56 L 830 56" fill="none" stroke="#00F0FF" stroke-width="2" />

  <!-- Pulsing beacon -->
  <circle cx="36" cy="32" r="5" fill="#00F0FF" filter="url(#portal-glow)" />

  <!-- Text -->
  <text x="56" y="38" class="portal-text" font-size="14" fill="#FFFFFF">
    [ TRANSMISSION ]  <tspan fill="#00F0FF">LAUNCH FULL 3D NEURAL DECK</tspan>  <tspan fill="#64748B">//</tspan>  <tspan fill="#00FFA3">ALIMUHAMMADASAD.GITHUB.IO</tspan>  &gt;&gt;&gt;
  </text>
  
  <text x="790" y="38" class="portal-text" font-size="16" fill="#00F0FF" filter="url(#portal-glow)">➔</text>
</svg>

